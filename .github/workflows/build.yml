name: build

on:
  workflow_dispatch:

env:
  PYVER: "3.11.17"
  TARGET: armv7-linux-musleabihf
  PREFIX: /data/local/tmp/pyhome
  ZLIB_VER: "1.3.2"
  OPENSSL_VER: "3.0.22"
  SQLITE_YEAR: "2026"
  SQLITE_NUMBER: "3530400"
  SQLITE_SHA256: "454e45f61c6bd75b7420e7190732dea03ce6639c63ada47bbc592f67fc34c0338"
  MUSLCROSS_TAG: "20261001"
  MUSLCROSS_SHA256: "6148dad77a465411e422393d3f31424c2b65b9abe42c67e7a106d0a92ab86023"
  BOOTLIN_SHA256: "9147bafae4aa272321a3c6440d04d83b7e23411b2d344f875541d84c4444ba9b"

jobs:
  build:
    name: static CPython for armv7l musl
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            ca-certificates curl wget xz-utils bzip2 file \
            zlib1g-dev libffi-dev

      - name: Install musl cross toolchain
        run: |
          set -eu
          CROSS=armv7-linux-musleabihf
          TC=$HOME/cross
          DL=$HOME/tc-dl
          rm -rf "$TC"
          mkdir -p "$TC" "$DL"

          # musl.cc is unreachable from the Actions runners, so the official
          # musl-cross release is tried first; Bootlin is the backup.
          fetch() {
            url="$1"
            want="$2"
            out="$DL/$(basename "$url")"
            echo "::group::fetch $url"
            if ! curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 \
                    --max-time 900 -o "$out" "$url"; then
              echo "::endgroup::"
              echo "download failed: $url"
              return 1
            fi
            if [ "$want" != "-" ]; then
              if ! echo "$want  $out" | sha256sum -c -; then
                echo "::endgroup::"
                echo "checksum failed: $url"
                return 1
              fi
            fi
            echo "::endgroup::"
            echo "$out"
          }

          ARCHIVE=""
          for spec in \
            "https://github.com/cross-tools/musl-cross/releases/download/$MUSLCROSS_TAG/armv7-unknown-linux-musleabihf.tar.xz|$MUSLCROSS_SHA256" \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--musl--stable-2026.08-1.tar.xz|$BOOTLIN_SHA256" \
            "https://musl.cc/armv7l-linux-musleabihf-cross.tgz|-"
          ; do
            url=${spec%%|*}
            want=${spec##*|}
            echo "### trying $url"
            if ARCHIVE=$(fetch "$url" "$want" 2>/dev/null | tail -n1) && [ -f "$ARCHIVE" ]; then
              break
            fi
            ARCHIVE=""
          done
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: no musl cross toolchain could be downloaded"
            exit 1
          fi
          echo "using $ARCHIVE"

          tar xf "$ARCHIVE" -C "$TC" --strip-components=1

          # Normalise the tool names: whatever triple the archive uses, expose
          # everything as $CROSS-* so the rest of the workflow is uniform.
          GCCBIN=$(ls "$TC"/bin/*-gcc | head -n1)
          TRIPLE=$(basename "$GCCBIN" | sed 's/-gcc$//')
          echo "toolchain triple: $TRIPLE"
          for t in "$TC"/bin/"$TRIPLE"-*; do
            b=$(basename "$t")
            ln -sfn "$t" "$TC/bin/$CROSS-${b#"$TRIPLE"-}"
          done
          for t in gcc cpp ar as ld nm objcopy objdump ranlib readelf strip; do
            [ -e "$TC/bin/$TRIPLE-$t" ] && ln -sfn "$TC/bin/$TRIPLE-$t" "$TC/bin/$CROSS-$t"
          done
          echo "$TC/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          set -eux
          ${{ env.TARGET }}-gcc --version
          ${{ env.TARGET }}-gcc -dumpmachine
          ${{ env.TARGET }}-gcc -print-multi-lib
          echo 'int main(void){return 0;}' > t.c
          ${{ env.TARGET }}-gcc -static -o t t.c
          file t
          ${{ env.TARGET }}-strip t
          file t
          ls ~/cross | tr '\n' ' '

      - name: Build zlib (static, armv7l musl)
        run: |
          set -eux
          DEPS="$GITHUB_WORKSPACE/deps"
          mkdir -p "$DEPS"
          curl -fsSLO https://zlib.net/zlib-${{ env.ZLIB_VER }}.tar.gz
          tar xzf zlib-${{ env.ZLIB_VER }}.tar.gz
          cd zlib-${{ env.ZLIB_VER }}
          CHOST=${{ env.TARGET }} \
          CC=${{ env.TARGET }}-gcc \
          AR=${{ env.TARGET }}-ar \
          RANLIB=${{ env.TARGET }}-ranlib \
            ./configure --static --prefix="$DEPS"
          make -j"$(nproc)"
          make install
          ls -l "$DEPS/lib"

      - name: Build OpenSSL (static, armv7l musl)
        run: |
          set -eux
          DEPS="$GITHUB_WORKSPACE/deps"
          curl -fsSLO https://www.openssl.org/source/openssl-${{ env.OPENSSL_VER }}.tar.gz
          tar xzf openssl-${{ env.OPENSSL_VER }}.tar.gz
          cd openssl-${{ env.OPENSSL_VER }}
          CFLAGS="-O2 -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard" \
          ./Configure linux-armv4 \
            --cross-compile-prefix=${{ env.TARGET }}- \
            --prefix="$DEPS" \
            --openssldir=/data/local/tmp/pyhome/ssl \
            no-shared no-tests
          make -j"$(nproc)"
          make install_sw
          ls -l "$DEPS/lib"

      - name: Build SQLite (static, armv7l musl)
        run: |
          set -eux
          DEPS="$GITHUB_WORKSPACE/deps"
          curl -fsSLO https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-autoconf-${{ env.SQLITE_NUMBER }}.tar.gz
          echo "${{ env.SQLITE_SHA256 }}  sqlite-autoconf-${{ env.SQLITE_NUMBER }}.tar.gz" | sha256sum -c -
          tar xzf sqlite-autoconf-${{ env.SQLITE_NUMBER }}.tar.gz
          cd sqlite-autoconf-${{ env.SQLITE_NUMBER }}
          ${{ env.TARGET }}-gcc -O2 -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard \
            -DSQLITE_THREADSAFE=1 \
            -DSQLITE_OMIT_LOAD_EXTENSION=1 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 \
            -DSQLITE_USE_URI=1 \
            -c sqlite3.c -o sqlite3.o
          ${{ env.TARGET }}-ar rcs libsqlite3.a sqlite3.o
          ${{ env.TARGET }}-ranlib libsqlite3.a
          mkdir -p "$DEPS/include" "$DEPS/lib"
          cp libsqlite3.a "$DEPS/lib/"
          cp sqlite3.h "$DEPS/include/"
          ls -l "$DEPS/lib"

      - name: Build host CPython ${{ env.PYVER }} (build interpreter)
        run: |
          set -eux
          curl -fsSLO https://www.python.org/ftp/python/${{ env.PYVER }}/Python-${{ env.PYVER }}.tgz
          tar xzf Python-${{ env.PYVER }}.tgz
          cd Python-${{ env.PYVER }}
          ./configure --prefix="$GITHUB_WORKSPACE/hostpy" --without-ensurepip \
            CFLAGS="-O1"
          make -j"$(nproc)"
          make install
          "$GITHUB_WORKSPACE/hostpy/bin/python3" -VV

      - name: Write Modules/Setup.local (all modules static, no dlopen)
        run: |
          set -eux
          cd Python-${{ env.PYVER }}
          DEPS="$GITHUB_WORKSPACE/deps"
          cat > Modules/Setup.local <<EOF
          # Generated by .github/workflows/build.yml
          # A static binary has no dlopen(), so every module is linked
          # straight into the interpreter.

          ZLIB_INC=$DEPS/include
          ZLIB_LIB=$DEPS/lib
          SSL_INC=$DEPS/include
          SSL_LIB=$DEPS/lib
          SQLITE_INC=$DEPS/include
          SQLITE_LIB=$DEPS/lib

          *static*

          # --- compression ---
          binascii binascii.c
          zlib zlibmodule.c -I\$(ZLIB_INC) -L\$(ZLIB_LIB) -lz

          # --- OpenSSL ---
          _ssl _ssl.c -I\$(SSL_INC) -L\$(SSL_LIB) -lssl -lcrypto
          _hashlib _hashopenssl.c -I\$(SSL_INC) -L\$(SSL_LIB) -lcrypto

          # --- SQLite ---
          _sqlite3 _sqlite/blob.c _sqlite/connection.c _sqlite/cursor.c _sqlite/microprotocols.c _sqlite/module.c _sqlite/prepare_protocol.c _sqlite/row.c _sqlite/statement.c _sqlite/util.c -I\$(SQLITE_INC) -L\$(SQLITE_LIB) -lsqlite3

          # --- hashing ---
          _md5 md5module.c
          _sha1 sha1module.c
          _sha256 sha256module.c
          _sha512 sha512module.c
          _sha3 _sha3/sha3module.c
          _blake2 _blake2/blake2module.c _blake2/blake2b_impl.c _blake2/blake2s_impl.c

          # --- numeric ---
          math mathmodule.c
          cmath cmathmodule.c
          _statistics _statisticsmodule.c
          audioop audioop.c
          _decimal _decimal/_decimal.c
          _datetime _datetimemodule.c

          # --- core stdlib ---
          array arraymodule.c
          _asyncio _asynciomodule.c
          _bisect _bisectmodule.c
          _contextvars _contextvarsmodule.c
          _csv _csv.c
          _heapq _heapqmodule.c
          _json _json.c
          _lsprof _lsprof.c rotatingtree.c
          _opcode _opcode.c
          _pickle _pickle.c
          _queue _queuemodule.c
          _random _randommodule.c
          _struct _struct.c
          _typing _typingmodule.c
          _xxsubinterpreters _xxsubinterpretersmodule.c
          _zoneinfo _zoneinfo.c

          # --- XML / text ---
          pyexpat pyexpat.c
          _elementtree _elementtree.c
          _codecs_cn cjkcodecs/_codecs_cn.c
          _codecs_hk cjkcodecs/_codecs_hk.c
          _codecs_iso2022 cjkcodecs/_codecs_iso2022.c
          _codecs_jp cjkcodecs/_codecs_jp.c
          _codecs_kr cjkcodecs/_codecs_kr.c
          _codecs_tw cjkcodecs/_codecs_tw.c
          _multibytecodec cjkcodecs/multibytecodec.c
          unicodedata unicodedata.c

          # --- unix ---
          fcntl fcntlmodule.c
          grp grpmodule.c
          mmap mmapmodule.c
          _posixsubprocess _posixsubprocess.c
          resource resource.c
          select selectmodule.c
          _socket socketmodule.c
          syslog syslogmodule.c
          termios termios.c
          _posixshmem _multiprocessing/posixshmem.c
          _multiprocessing -I\$(srcdir)/Modules/_multiprocessing _multiprocessing/multiprocessing.c _multiprocessing/semaphore.c
          EOF
          cat Modules/Setup.local

      - name: Cross-compile CPython ${{ env.PYVER }}
        run: |
          set -eux
          cd Python-${{ env.PYVER }}
          ./configure \
            --prefix=${{ env.PREFIX }} \
            --host=${{ env.TARGET }} \
            --build=x86_64-linux-gnu \
            --with-build-python="$GITHUB_WORKSPACE/hostpy/bin/python3" \
            --without-ensurepip \
            --disable-shared \
            --with-system-expat=no \
            --with-system-libmpdec=no \
            --with-system-ffi=no \
            ac_cv_file__dev_ptmx=yes \
            ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no \
            CFLAGS="-O2 -fno-asynchronous-unwind-tables -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard" \
            LDFLAGS="-static -no-pie"
          make -j"$(nproc)"
          make DESTDIR="$GITHUB_WORKSPACE/stage" install

      - name: Verify static binary
        run: |
          set -eux
          cd Python-${{ env.PYVER }}
          file python
          ${{ env.TARGET }}-readelf -h python | sed -n '1,12p'
          echo "--- static? ---"
          if ${{ env.TARGET }}-readelf -l python | grep -q INTERP; then
            echo "ERROR: binary has a dynamic interpreter"
            exit 1
          fi
          echo "no INTERP segment: binary is fully static"
          echo "--- builtin modules: $(grep -c PyInit_ Modules/config.c) ---"

      - name: Package pyhome
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/stage${{ env.PREFIX }}"
          PKG="$GITHUB_WORKSPACE/artifact/pyhome"
          test -x "$SRC/bin/python3"
          mkdir -p "$PKG"
          cp -a "$SRC/." "$PKG/"

          # drop what the phone does not need
          rm -rf "$PKG/include"
          rm -rf "$PKG/share"
          rm -rf "$PKG/lib/pkgconfig"
          rm -f  "$PKG/lib/python3.11/"*.a "$PKG/lib/python3.11/"*.o
          rm -f  "$PKG/lib/libpython3.11.a"
          rm -rf "$PKG/lib/python3.11/test"
          rm -rf "$PKG/lib/python3.11/idlelib"
          rm -rf "$PKG/lib/python3.11/tkinter"
          rm -rf "$PKG/lib/python3.11/turtledemo"
          rm -rf "$PKG/lib/python3.11/lib2to3"
          rm -rf "$PKG/lib/python3.11/ctypes"
          rm -rf "$PKG/lib/python3.11/ensurepip"
          find "$PKG" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "$PKG" -name '*.pyc' -delete

          # strip the binary
          for f in "$PKG/bin/python3" "$PKG/bin/python3.11"; do
            ${{ env.TARGET }}-strip "$f"
          done

          # wrapper script: force LF endings, Android 5.1 chokes on CRLF
          sed -e 's/\r$//' "$GITHUB_WORKSPACE/device/py" > "$GITHUB_WORKSPACE/artifact/py"
          chmod 755 "$PKG/bin/python3" "$PKG/bin/python3.11" \
                   "$GITHUB_WORKSPACE/artifact/py"

          echo "--- sizes ---"
          du -sh "$PKG"
          ls -l "$PKG/bin"
          file "$PKG/bin/python3"

          tar czf python-j1-${{ env.PYVER }}-armv7l-musl.tar.gz \
            -C "$GITHUB_WORKSPACE/artifact" pyhome py
          ls -l python-j1-${{ env.PYVER }}-armv7l-musl.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-j1-${{ env.PYVER }}-armv7l-musl
          path: python-j1-${{ env.PYVER }}-armv7l-musl.tar.gz
          if-no-files-found: error
          retention-days: 30
